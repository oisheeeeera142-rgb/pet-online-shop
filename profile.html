<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PetShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</head>

<body class="bg-gray-50">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="text-2xl font-bold text-emerald-600">
                🐾 PetShop
            </div>

            <div class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="text-gray-700 hover:text-emerald-600">Home</a>
                <a href="products.html" class="text-gray-700 hover:text-emerald-600">Products</a>
                <div id="navbarMenu"></div>" class="flex gap-4 items-center">
            </div>
        </div>

        </div>
    </nav>

    <!-- PROFILE -->
    <section class="container mx-auto px-6 py-10">

        <h1 class="text-3xl font-bold mb-6">My Profile</h1>

        <div class="grid md:grid-cols-2 gap-6">

            <!-- PROFILE INFO -->
            <div class="bg-white p-6 rounded shadow">

                <div class="text-center mb-6">
                    <img id="profileImg" class="w-24 h-24 rounded-full mx-auto object-cover"
                        src="https://via.placeholder.com/100" />
                </div>

                <form id="profileForm" class="space-y-4">

                    <input type="text" id="name" placeholder="Name" />
                    <input type="email" id="email" placeholder="Email" />

                    <input type="file" id="image" accept="image/*" />

                    <button type="submit" class="btn-primary w-full">
                        Update Profile
                    </button>

                </form>

                <button onclick="logoutUser()" class="mt-4 w-full bg-red-500 text-white py-2 rounded hover:bg-red-600">
                    Logout
                </button>

            </div>

            <!-- INFO BOX -->
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-semibold mb-4">Account Info</h2>

                <p class="text-gray-600">Manage your profile details and keep your account updated.</p>
            </div>

        </div>

    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            if (!isLoggedIn()) {
                localStorage.setItem("redirectAfterLogin", window.location.href);
                window.location.href = "login.html";
                return;
            }

            renderNavbar();

            const user = getCurrentUser();

            document.getElementById("name").value = user.name;
            document.getElementById("email").value = user.email;

            const img = document.getElementById("profileImg");

            if (user.image) {
                img.src = user.image;
            }

            document.getElementById("profileForm").addEventListener("submit", function (e) {
                e.preventDefault();

                let users = JSON.parse(localStorage.getItem("users") || "[]");

                const updatedUser = {
                    ...user,
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value
                };

                const file = document.getElementById("image").files[0];

                if (file) {
                    const reader = new FileReader();

                    reader.onload = function () {
                        updatedUser.image = reader.result;

                        saveUpdate(updatedUser, users);
                    };

                    reader.readAsDataURL(file);
                } else {
                    saveUpdate(updatedUser, users);
                }

                function saveUpdate(updatedUser, users) {

                    const index = users.findIndex(u => u.id === user.id);
                    users[index] = updatedUser;

                    localStorage.setItem("users", JSON.stringify(users));
                    localStorage.setItem("currentUser", JSON.stringify(updatedUser));

                    alert("Profile updated!");
                    location.reload();
                }
            });

        });
    </script>

</body>

</html>
