<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - PetShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="bg-gray-50">
    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="text-2xl font-bold text-emerald-600">
                🐾 PetShop
            </div>

            <div class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="text-gray-700 hover:text-emerald-600">Home</a>
                <a href="products.html" class="text-emerald-600 font-semibold">Products</a>
                <div id="navbarAuth" class="flex gap-4 items-center"></div>
            </div>

        </div>
    </nav>



    <!-- FILTER BAR -->
    <div class="max-w-7xl mx-auto px-6 mt-10">

        <div class="bg-white p-5 rounded-2xl shadow">

            <!-- SEARCH + SORT -->
            <div class="flex flex-col md:flex-row gap-4 items-center">

                <!-- SEARCH -->
                <div class="relative w-full md:w-1/2">
                    <input type="text" id="searchInput" placeholder="Search dog food, cat toys..."
                        class="w-full px-5 py-3 pl-12 border rounded-full focus:ring-2 focus:ring-emerald-500"
                        onkeyup="filterProducts()">

                    <span class="absolute left-4 top-3.5 text-gray-400">🔍</span>
                </div>

                <!-- SORT -->
                <select class="w-full md:w-1/4 px-4 py-3 border rounded-full" id="sortSelect" onchange="sortProducts()">

                    <option value="default">Sort: Default</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="rating">Top Rated</option>

                </select>

            </div>

            <!-- CATEGORY FILTER (YOUR PRODUCTS MATCHED) -->

            <div class="flex flex-wrap gap-3 mt-6">

                <button onclick="setCategory('all')" class="cat-btn">All</button>

                <button onclick="setCategory('Food')" class="cat-btn">
                    Food
                </button>

                <button onclick="setCategory('Accessories')" class="cat-btn">
                    Accessories
                </button>

                <button onclick="setCategory('Care')" class="cat-btn">
                    Care
                </button>

                <button onclick="setCategory('Toy')" class="cat-btn">
                    Toy
                </button>

            </div>
        </div>

    </div>

    </div>

    </div>

    <!-- PRODUCTS GRID -->
    <div class="max-w-7xl mx-auto px-6 py-10">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
    </div>

    <!-- SCRIPTS (ORDER IMPORTANT) -->
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/products.js" defer></script>
    <script src="assets/js/app.js" defer></script>




    <footer class="bg-slate-950 text-gray-300 mt-16">

        <div class="max-w-7xl mx-auto px-6 py-16">

            <div class="grid md:grid-cols-3 gap-12">

                <div>
                    <h2 class="text-4xl font-bold text-emerald-400 mb-4">
                        🐾 PetShop
                    </h2>

                    <p class="text-gray-400">
                        Your trusted destination for pet food,
                        accessories and care products.
                    </p>
                </div>

                <div>
                    <h3 class="text-xl font-bold text-white mb-4">
                        Quick Links
                    </h3>

                    <ul class="space-y-3">
                        <li><a href="index.html" class="hover:text-emerald-400">Home</a></li>
                        <li><a href="products.html" class="hover:text-emerald-400">Products</a></li>
                        <li><a href="cart.html" class="hover:text-emerald-400">Cart</a></li>
                    </ul>
                </div>

                <div>
                    <h3 class="text-xl font-bold text-white mb-4">
                        Contact
                    </h3>

                    <p>📧 support@petshop.com</p>
                    <p class="mt-2">📞 +880 1700-000000</p>
                    <p class="mt-2">📍 Dhaka, Bangladesh</p>
                </div>

            </div>

        </div>

        <div class="border-t border-gray-800 py-6 text-center text-gray-500">
            © 2026 PetShop. All Rights Reserved.
        </div>

    </footer>
</body>

</html>
