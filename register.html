<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PetShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/auth.js" defer></script>
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">

        <h2 class="text-2xl font-bold text-center text-emerald-600 mb-6">Register</h2>

        <form id="registerForm" class="space-y-4">

            <input type="text" id="name" placeholder="Name" required />

            <input type="email" id="email" placeholder="Email" required />

            <input type="password" id="password" placeholder="Password" required />

            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">
                Register
            </button>

            <p id="msg" class="text-sm text-center text-red-500"></p>

        </form>

        <p class="text-center text-sm mt-4">
            Already have an account?
            <a href="login.html" class="text-emerald-600">Login</a>
        </p>

    </div>

    <script>
        const form = document.getElementById("registerForm");
        const msg = document.getElementById("msg");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const res = registerUser(name, email, password);

            if (!res.status) {
                msg.textContent = res.message;
            } else {
                msg.style.color = "green";
                msg.textContent = "Registration successful! Redirecting...";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            }
        });
    </script>

</body>

</html>
