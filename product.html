<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - PetShop</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/products.js" defer></script>
    <script src="assets/js/cart.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</head>

<body class="bg-gray-50">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="text-2xl font-bold text-emerald-600">
                🐾 PetShop
            </div>

            <div class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="text-gray-700 hover:text-emerald-600">Home</a>
                <a href="products.html" class="text-gray-700 hover:text-emerald-600">Products</a>
                <div id="navbarAuth" class="flex gap-4 items-center"></div>
            </div>

        </div>
    </nav>

    <!-- PRODUCT DETAILS -->
    <section class="container mx-auto px-6 py-10">
        <div id="productDetails" class="bg-white p-6 rounded-xl shadow-md"></div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const container = document.getElementById("productDetails");

            // 1. Auth check
            if (!isLoggedIn()) {
                localStorage.setItem("redirectAfterLogin", window.location.href);
                window.location.href = "login.html";
                return;
            }

            // 2. Get ID safely
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                container.innerHTML = `
                    <h2 class="text-red-500 text-xl">
                        Invalid Product ID
                    </h2>
                `;
                return;
            }

            // 3. Get product
            const product = getProductById(id);

            if (!product) {
                container.innerHTML = `
                    <h2 class="text-red-500 text-xl">
                        Product Not Found
                    </h2>
                `;
                return;
            }

            // 4. Render product UI
            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8">

                    <img 
                        src="${product.image}" 
                        class="w-full rounded-xl shadow object-cover"
                    >

                    <div>

                        <h1 class="text-4xl font-bold">
                            ${product.name}
                        </h1>

                        <p class="text-gray-500 mt-2">
                            ${product.category}
                        </p>

                        <p class="text-yellow-500 mt-2">
                            ⭐ ${product.rating}
                        </p>

                        <p class="text-emerald-600 text-3xl font-bold mt-4">
                            ৳${product.price}
                        </p>

                        <p class="mt-6 text-gray-700">
                            ${product.description}
                        </p>

                        <!-- Quantity -->
                        <div class="flex items-center gap-3 mt-6 mb-5">
                            <span>Quantity:</span>

                            <input 
                                type="number"
                                id="qty"
                                min="1"
                                value="1"
                                class="w-20 border rounded-lg px-3 py-2"
                            >
                        </div>

                        <!-- Add to Cart -->
                        <button
                            onclick="handleAddToCart(${product.id})"
                            class="w-full md:w-64 bg-emerald-600 text-white py-4 rounded-xl hover:bg-emerald-700 transition"
                        >
                            🛒 Add To Cart
                        </button>

                    </div>

                </div>
            `;
        });

        // 5. Safe cart handler (IMPORTANT FIX)
        function handleAddToCart(productId) {
            const qty = parseInt(document.getElementById("qty").value) || 1;
            addToCart(productId, qty);
        }
    </script>

</body>

</html>
