<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - PetShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/products.js" defer></script>
    <script src="assets/js/cart.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</head>

<body class="bg-gray-50">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">

            <div class="text-2xl font-bold text-emerald-600">
                🐾 PetShop
            </div>

            <div id="navbarMenu" class="hidden md:flex items-center w-full ml-10">
            </div>

        </div>
    </nav>

    <!-- CART -->
    <section class="container mx-auto px-6 py-10">

        <h1 class="text-4xl font-bold mb-8 text-center">
            🛒 My Cart
        </h1>

        <div class="bg-white rounded-2xl shadow-lg p-6">

            <div id="cartItems" class="space-y-4"></div>

            <hr class="my-6">

            <div class="flex justify-between items-center">

                <h2 id="cartTotal" class="text-2xl font-bold text-emerald-600">
                    Total: ৳0
                </h2>

                <a href="checkout.html"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl font-semibold">
                    Checkout
                </a>

            </div>

        </div>

    </section>
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            if (!isLoggedIn()) {
                localStorage.setItem("redirectAfterLogin", window.location.href);
                window.location.href = "login.html";
                return;
            }

            renderNavbar();
            renderCart();
        });
    </script>

</body>

</html>
